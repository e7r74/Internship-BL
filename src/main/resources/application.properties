spring.application.name=internship
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/internship_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

logging.level.com.bitlab.internship=DEBUG

keycloak.url=http://localhost:8081
keycloak.realm=internship-realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.url}/realms/${keycloak.realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.url}/realms/${keycloak.realm}/protocol/openid-connect/certs

keycloak.resource-client=internship-client
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:JCzVeDftyS4lOq82wWBXdSX4dtPiifGy}
keycloak.token-uri=${keycloak.url}/realms/${keycloak.realm}/protocol/openid-connect/token